<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShelfLife — Book Catalog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ds/tokens.css" />
    <link rel="stylesheet" href="/ds/components.css" />
  </head>
  <body>
    <a href="#main-content" class="ak-skip-link">Skip to main content</a>
    <header id="appHeader"></header>

    <main id="main-content" class="container pb-5">
      <h1 style="font-size: var(--ak-font-size-h1); margin-bottom: 16px">
        Book Catalog
      </h1>

      <section
        aria-label="Search and filter books"
        class="row g-3 align-items-end mb-4"
      >
        <div class="col-12 col-md-5">
          <div class="ak-field" style="margin-bottom: 0">
            <label class="ak-label" for="searchInput">Search books</label>
            <input
              type="search"
              id="searchInput"
              class="ak-textfield"
              placeholder="Search by title, author, or ISBN..."
            />
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="ak-field" style="margin-bottom: 0">
            <label class="ak-label" for="categoryFilter">Category</label>
            <select id="categoryFilter" class="ak-select">
              <option value="all">All categories</option>
              <option value="Software">Software</option>
              <option value="Design">Design</option>
              <option value="Accessibility">Accessibility</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Fiction">Fiction</option>
              <option value="Non-Fiction">Non-Fiction</option>
            </select>
          </div>
        </div>
        <div class="col-12 col-md-3">
          <label class="ak-checkbox-wrapper" style="margin-bottom: 8px">
            <input type="checkbox" id="availableOnly" class="ak-checkbox" />
            Available copies only
          </label>
        </div>
      </section>

      <p
        id="resultsCount"
        role="status"
        aria-live="polite"
        style="
          font-weight: 600;
          color: var(--ak-color-text-muted);
          margin-bottom: 16px;
        "
      ></p>

      <div id="catalogGrid" class="row g-3"></div>
    </main>

    <!-- Screen S6: Book Details Modal Dialog -->
    <div
      id="bookDetailsModal"
      class="ak-dialog"
      role="dialog"
      aria-labelledby="modalBookTitle"
      hidden
    >
      <h2 id="modalBookTitle" style="margin-top: 0">Book Title</h2>
      <p id="modalBookMeta" style="color: var(--ak-color-text-muted)"></p>
      <p id="modalBookStatus"></p>
      <div id="modalBookAlert"></div>
      <div class="d-flex gap-2 mt-4 flex-wrap">
        <button type="button" class="ak-button secondary" data-dialog-close>
          Close
        </button>
        <button type="button" class="ak-button primary" id="modalCheckoutBtn">
          Check out
        </button>
      </div>
    </div>

    <script src="/ds/js/dialog.js"></script>
    <script src="/ds/js/toast.js"></script>
    <script src="/app/js/store.js"></script>
    <script>
      let selectedBookId = null;

      function renderCatalog() {
        const query = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        const cat = document.getElementById("categoryFilter").value;
        const onlyAvail = document.getElementById("availableOnly").checked;

        const books = getBooks().filter((b) => {
          const matchesQuery =
            !query ||
            b.title.toLowerCase().includes(query) ||
            b.author.toLowerCase().includes(query) ||
            b.isbn.includes(query);
          const matchesCat = cat === "all" || b.category === cat;
          const matchesAvail = !onlyAvail || getAvailableCopies(b.id) > 0;
          return matchesQuery && matchesCat && matchesAvail;
        });

        const countEl = document.getElementById("resultsCount");
        countEl.textContent = `${books.length} ${books.length === 1 ? "book" : "books"} found`;

        const grid = document.getElementById("catalogGrid");
        if (books.length === 0) {
          grid.innerHTML = `<div class="col-12"><div class="ak-alert">No books match "${query || cat}". Try a different title or author.</div></div>`;
          return;
        }

        grid.innerHTML = books
          .map((book) => {
            const avail = getAvailableCopies(book.id);
            const badge =
              avail > 0
                ? `<span class="ak-badge success">Available (${avail} of ${book.copies})</span>`
                : `<span class="ak-badge danger">Checked out</span>`;

            return `
          <div class="col-12 col-sm-6 col-lg-3">
            <article class="ak-card">
              <div>
                <div class="mb-2">${badge}</div>
                <h3>${book.title}</h3>
                <p style="color:var(--ak-color-text-muted); margin-bottom:4px;">${book.author}</p>
                <p style="font-size:var(--ak-font-size-sm); color:var(--ak-color-text-muted);">${book.category}</p>
              </div>
              <button type="button" class="ak-button secondary mt-3" onclick="openBookDetails('${book.id}', this)">View details</button>
            </article>
          </div>
        `;
          })
          .join("");
      }

      function openBookDetails(bookId, triggerEl) {
        selectedBookId = bookId;
        const book = getBooks().find((b) => b.id === bookId);
        const session = getSession();
        const avail = getAvailableCopies(bookId);
        const activeLoans = getLoans().filter((l) => !l.returnedOn);

        document.getElementById("modalBookTitle").textContent = book.title;
        document.getElementById("modalBookMeta").innerHTML =
          `<strong>Author:</strong> ${book.author}<br><strong>Category:</strong> ${book.category}<br><strong>ISBN:</strong> ${book.isbn}`;
        document.getElementById("modalBookStatus").innerHTML =
          avail > 0
            ? `<span class="ak-badge success">Available (${avail} copies)</span>`
            : `<span class="ak-badge danger">All copies checked out</span>`;

        const alertBox = document.getElementById("modalBookAlert");
        const checkoutBtn = document.getElementById("modalCheckoutBtn");
        alertBox.innerHTML = "";
        checkoutBtn.disabled = false;

        if (!session) {
          alertBox.innerHTML = `<div class="ak-alert warning">Please sign in as a Member to check out books.</div>`;
          checkoutBtn.disabled = true;
        } else if (session.role === "librarian") {
          alertBox.innerHTML = `<div class="ak-alert">Librarians manage books via Add Book and All Loans.</div>`;
          checkoutBtn.disabled = true;
        } else {
          const myLoans = activeLoans.filter(
            (l) => l.userId === session.userId,
          );
          const alreadyHas = myLoans.some((l) => l.bookId === bookId);
          if (alreadyHas) {
            alertBox.innerHTML = `<div class="ak-alert warning" role="alert">You already have this book.</div>`;
            checkoutBtn.disabled = true;
          } else if (myLoans.length >= 3) {
            alertBox.innerHTML = `<div class="ak-alert warning" role="alert">You can borrow up to 3 books. Return one first.</div>`;
            checkoutBtn.disabled = true;
          } else if (avail === 0) {
            checkoutBtn.disabled = true;
          }
        }

        openDialog("bookDetailsModal", triggerEl);
      }

      document
        .getElementById("modalCheckoutBtn")
        .addEventListener("click", () => {
          const session = getSession();
          if (!session || !selectedBookId) return;

          const today = getToday();
          const dueOn = addDays(today, 14);
          const loans = getLoans();
          loans.push({
            id: "l_" + Date.now(),
            bookId: selectedBookId,
            userId: session.userId,
            checkedOutOn: today,
            dueOn,
            returnedOn: null,
            renewed: false,
          });
          saveLoans(loans);
          closeDialog(document.getElementById("bookDetailsModal"));
          renderCatalog();
          showToast(`Checked out. Due on ${formatDate(dueOn)}.`, "success");
        });

      document.addEventListener("DOMContentLoaded", async () => {
        await initStore();
        renderAppHeader("catalog");
        renderCatalog();

        document
          .getElementById("searchInput")
          .addEventListener("input", renderCatalog);
        document
          .getElementById("categoryFilter")
          .addEventListener("change", renderCatalog);
        document
          .getElementById("availableOnly")
          .addEventListener("change", renderCatalog);
      });
    </script>
  </body>
</html>
